spring:
  application:
    name: core-api
  threads:
    # Requests waiting on slow upstreams (OpenRouter) park a virtual thread instead of holding one of
    # Tomcat's ~200 platform threads. Outbound concurrency is capped per client, see open-router below.
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:job_search}
    username: ${POSTGRES_USER:zhenya}
    password: ${POSTGRES_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 40s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  # Let in-flight requests finish on deploy; the job dispatcher stops claiming in its own @PreDestroy.
  shutdown: graceful
  # Behind a trusted reverse proxy (nginx/ALB) set "native": Tomcat's RemoteIpValve then resolves the real
  # client address (rightmost X-Forwarded-For entry not in SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES, a CIDR list or regex;
  # default = private ranges) and the scheme from X-Forwarded-Proto. Do NOT use "framework": its
  # ForwardedHeaderFilter takes the LEFTMOST (client-supplied) address, which defeats the auth rate limit.
  # Default "none": safe when reachable directly.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: true

management:
  # Only health is exposed (liveness/readiness probes for the orchestrator); no details, no other endpoints.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  admin-email: ${APP_ADMIN_EMAIL:}
  bootstrap-password: ${APP_BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth-rate-limit:
    login-per-minute: ${APP_AUTH_LOGIN_PER_MINUTE:10}
    register-per-minute: ${APP_AUTH_REGISTER_PER_MINUTE:5}
  expensive-ops-rate-limit:
    per-user-per-minute: ${APP_EXPENSIVE_OPS_PER_USER_PER_MINUTE:10}
  open-router:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    site-url: ${OPENROUTER_SITE_URL:http://localhost:5173}
    site-name: ${OPENROUTER_SITE_NAME:Job Search}
    read-timeout-seconds: ${OPENROUTER_READ_TIMEOUT_SECONDS:90}
    max-concurrent-requests: ${OPENROUTER_MAX_CONCURRENT_REQUESTS:20}
    max-tokens: ${OPENROUTER_MAX_TOKENS:8000}
  ats-screener:
    base-url: ${ATS_SCREENER_BASE_URL:http://127.0.0.1:5174}
    timeout-seconds: ${ATS_SCREENER_TIMEOUT_SECONDS:180}
  latex-worker:
    base-url: ${LATEX_WORKER_BASE_URL:http://127.0.0.1:8090}
    token: ${LATEX_WORKER_TOKEN:}
    read-timeout-seconds: ${LATEX_WORKER_READ_TIMEOUT_SECONDS:75}
