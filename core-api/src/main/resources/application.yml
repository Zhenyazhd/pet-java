spring:
  application:
    name: core-api
  threads:
    # Requests waiting on slow upstreams (OpenRouter) park a virtual thread instead of holding one of
    # Tomcat's ~200 platform threads. Outbound concurrency is capped per client, see open-router below.
    virtual:
      enabled: true
  web:
    # Validation messages are the same whatever the browser's language is; the UI is English.
    locale: en
    locale-resolver: fixed
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:job_search}
    username: ${POSTGRES_USER:zhenya}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Explicit, so the number is a decision and not the library's default. Jobs hold no connection while they
      # wait for the AI or the worker, so this covers web requests plus short job writes.
      maximum-pool-size: ${DB_POOL_SIZE:10}
  # The SMTP server is set with SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (and SPRING_MAIL_PORT);
  # without a host the app only logs what it would send. These bound a slow or silent server.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  lifecycle:
    timeout-per-shutdown-phase: 40s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  # Let in-flight requests finish on deploy; the job dispatcher stops claiming in its own @PreDestroy.
  shutdown: graceful
  # Behind a trusted reverse proxy (nginx/ALB) set "native": Tomcat's RemoteIpValve then resolves the real
  # client address (rightmost X-Forwarded-For entry not in SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES, a CIDR list or regex;
  # default = private ranges) and the scheme from X-Forwarded-Proto. Do NOT use "framework": its
  # ForwardedHeaderFilter takes the LEFTMOST (client-supplied) address, which defeats the auth rate limit.
  # Default "none": safe when reachable directly.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: true

logging:
  pattern:
    level: "%5p [user=%X{userId:-}]"

management:
  # Only health is exposed (liveness/readiness probes for the orchestrator); no details, no other endpoints.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness is for restarting a stuck process and must not depend on the database; readiness (is it
        # worth sending requests here) does.
        readiness:
          include: readinessState,db
      show-details: never

app:
  admin-email: ${APP_ADMIN_EMAIL:}
  strict-secrets: ${APP_STRICT_SECRETS:false}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:}
  # Sign-in with Google (an OAuth client of type "Web application"; its redirect URI is <public-base-url>/login/oauth2/code/google).
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
    client-secret: ${APP_GOOGLE_CLIENT_SECRET:}
  bootstrap-password: ${APP_BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth-rate-limit:
    login-per-minute: ${APP_AUTH_LOGIN_PER_MINUTE:10}
    register-per-minute: ${APP_AUTH_REGISTER_PER_MINUTE:5}
  expensive-ops-rate-limit:
    per-user-per-minute: ${APP_EXPENSIVE_OPS_PER_USER_PER_MINUTE:10}
  open-router:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    site-url: ${OPENROUTER_SITE_URL:http://localhost:5173}
    site-name: ${OPENROUTER_SITE_NAME:Job Search}
    read-timeout-seconds: ${OPENROUTER_READ_TIMEOUT_SECONDS:90}
    max-concurrent-requests: ${OPENROUTER_MAX_CONCURRENT_REQUESTS:20}
    max-tokens: ${OPENROUTER_MAX_TOKENS:8000}
  pdf-worker:
    base-url: ${PDF_WORKER_BASE_URL:http://127.0.0.1:8090}
    token: ${PDF_WORKER_TOKEN:}
    read-timeout-seconds: ${PDF_WORKER_READ_TIMEOUT_SECONDS:75}
  ats-worker:
    # The PDF readability check and the vacancy match need the separate tools/ats-worker; off unless you run it.
    enabled: ${ATS_WORKER_ENABLED:false}
    base-url: ${ATS_WORKER_BASE_URL:http://127.0.0.1:8091}
    token: ${ATS_WORKER_TOKEN:}
    read-timeout-seconds: ${ATS_WORKER_READ_TIMEOUT_SECONDS:30}
    score-timeout-seconds: ${ATS_WORKER_SCORE_TIMEOUT_SECONDS:100}
    max-matches-per-user-per-day: ${ATS_WORKER_MAX_MATCHES_PER_USER_PER_DAY:20}
  job-list:
    # Blank token = the job matches feature is off (no startup failure).
    base-url: ${JOB_LIST_BASE_URL:http://127.0.0.1:8100}
    token: ${JOB_LIST_TOKEN:}
    connect-timeout-seconds: ${JOB_LIST_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${JOB_LIST_READ_TIMEOUT_SECONDS:15}
