# Profile for @SpringBootTest classes; the database comes from TestcontainersConfiguration.
spring:
  datasource:
    password: unused-replaced-by-testcontainers

app:
  admin-email: admin@test.local
  scheduling-enabled: false
  latex-worker:
    token: test-token
  open-router:
    # The LLM is mocked in tests; the key only has to be non-blank.
    api-key: test-key
