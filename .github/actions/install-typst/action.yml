name: Install Typst
description: Downloads the pinned Typst release (x86_64 musl), verifies its sha256 and puts it on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # Keep the version and checksum in step with tools/pdf-worker/Dockerfile (TYPST_VERSION, TYPST_SHA256_AMD64).
        TYPST_VERSION: '0.15.1'
        TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
      run: |
        curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
        echo "${TYPST_SHA256}  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
        mkdir "$RUNNER_TEMP/typst"
        tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP/typst"
        echo "$RUNNER_TEMP/typst/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
    - shell: bash
      run: typst --version
