name: Deploy

# After CI has passed on a push to main (tests and images), or by hand for a commit that is already on main.
# Nothing from the repository runs here: the server runs its own copy of deploy/deploy.sh, which refuses any commit
# that is not on main. GitHub holds no cluster keys. The AWS key it holds belongs to an IAM user that may do one thing:
# run the cvhelper-deploy document on one server. The key is a secret of the production environment, so only a job that
# the reviewer approved can read it. Rotate it every few months.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit sha on main to deploy (also the way to roll back to an older release)
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to cvhelper.dev
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits for the reviewer set on the environment.
    environment: production
    env:
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Check the commit sha
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run deploy.sh on the server and wait for it
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command --document-name cvhelper-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "sha=$SHA" --query Command.CommandId --output text)
          for _ in $(seq 1 240); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text
          [ "$status" = Success ]
