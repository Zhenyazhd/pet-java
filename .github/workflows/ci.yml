name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-api:
    name: core-api (Java 25, Postgres via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp test
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-surefire-reports
          path: core-api/target/surefire-reports
          retention-days: 7

  latex-worker:
    name: latex-worker (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/latex-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp test
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-worker-surefire-reports
          path: tools/latex-worker/target/surefire-reports
          retention-days: 7

  frontend:
    name: frontend (type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Dependency advisories (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
