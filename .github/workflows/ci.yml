name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-api:
    name: core-api (Java 25, Postgres via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # ResumeTypstRendererTest compiles real Typst.
      - uses: ./.github/actions/install-typst
      - run: ./mvnw -B -ntp test
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-surefire-reports
          path: core-api/target/surefire-reports
          retention-days: 7

  pdf-worker:
    name: pdf-worker (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/pdf-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The compile tests skip without typst; this is the same pinned release as tools/pdf-worker/Dockerfile.
      - uses: ./.github/actions/install-typst
      - run: ./mvnw -B -ntp test
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-worker-surefire-reports
          path: tools/pdf-worker/target/surefire-reports
          retention-days: 7

  ats-worker:
    name: ats-worker (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/ats-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp test
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ats-worker-surefire-reports
          path: tools/ats-worker/target/surefire-reports
          retention-days: 7

  job-list:
    name: job-list (Java 25, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/job-list
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp test
      - name: Keep the test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-list-surefire-reports
          path: tools/job-list/target/surefire-reports
          retention-days: 7

  frontend:
    name: frontend (type check and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Dependency advisories (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  images:
    name: images (amd64 -> ghcr.io)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [core-api, pdf-worker, ats-worker, job-list, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cvhelper-core-api, context: core-api }
          - { name: cvhelper-pdf-worker, context: tools/pdf-worker }
          - { name: cvhelper-ats-worker, context: tools/ats-worker }
          - { name: cvhelper-web, context: frontend }
          - { name: cvhelper-job-list, context: tools/job-list }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (the registry wants lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
