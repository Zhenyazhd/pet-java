apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    # Switch to letsencrypt-staging for the first try, so a mistake does not use up the production rate limits.
    cert-manager.io/cluster-issuer: letsencrypt-prod # TODO: change to letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [cvhelper.dev]
      secretName: cvhelper-dev-tls
  rules:
    - host: cvhelper.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
---
# Plain http is only ever answered with a redirect to https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme: { scheme: https, permanent: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cvhelper-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: cvhelper.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
