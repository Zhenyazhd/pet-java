apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: job_search
  POSTGRES_USER: job_search
  DB_POOL_SIZE: "10"
  PDF_WORKER_BASE_URL: http://pdf-worker:8090
  ATS_WORKER_ENABLED: "true"
  ATS_WORKER_BASE_URL: http://ats-worker:8091
  JOB_LIST_BASE_URL: http://job-list:8100
  SERVER_FORWARD_HEADERS_STRATEGY: native
  APP_STRICT_SECRETS: "true"
  APP_CORS_ALLOWED_ORIGINS: https://cvhelper.dev
  # Links in emails and the sender; the SMTP server (Resend) is reached with the key kept in cvhelper-secrets.
  APP_PUBLIC_BASE_URL: https://cvhelper.dev
  APP_MAIL_FROM: Job Search <noreply@cvhelper.dev>
  SPRING_MAIL_HOST: smtp.resend.com
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_USERNAME: resend
  OPENROUTER_SITE_URL: https://cvhelper.dev
  TZ: UTC
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  selector: { app: core-api }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: core-api }
  template:
    metadata:
      labels: { app: core-api }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: core-api
          image: core-api
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: core-api }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: POSTGRES_PASSWORD } }
            - name: PDF_WORKER_TOKEN
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: PDF_WORKER_TOKEN } }
            - name: ATS_WORKER_TOKEN
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: ATS_WORKER_TOKEN } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: OPENROUTER_API_KEY } }
            # optional: without the job-list secret the variable is absent and job matches stay off
            - name: JOB_LIST_TOKEN
              valueFrom: { secretKeyRef: { name: job-list-secrets, key: CORE_API_TOKEN, optional: true } }
            # Optional: without the Google keys in the secret, sign-in with Google stays off.
            - name: APP_GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: GOOGLE_CLIENT_ID, optional: true } }
            - name: APP_GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: GOOGLE_CLIENT_SECRET, optional: true } }
            - name: SPRING_MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: SMTP_PASSWORD } }
            - name: APP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: APP_ADMIN_EMAIL } }
            - name: APP_BOOTSTRAP_PASSWORD
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: APP_BOOTSTRAP_PASSWORD } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 640Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
