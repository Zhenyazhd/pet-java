apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-from-core-api }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [core-api, job-list, job-list-db-init] }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-from-core-api }
spec:
  podSelector: { matchLabels: { app: pdf-worker } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: core-api } } }]
      ports: [{ port: 8090 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: core-api-from-web }
spec:
  podSelector: { matchLabels: { app: core-api } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: web } } }]
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-from-traefik }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: no-egress-worker }
spec:
  podSelector: { matchLabels: { app: pdf-worker } }
  policyTypes: [Egress]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: no-egress-postgres }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Egress]
  egress: []
---
# job-list answers core-api inside the cluster and, over its public hostname, Traefik (for the bot).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: job-list-from-core-api-and-traefik }
spec:
  podSelector: { matchLabels: { app: job-list } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: core-api } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ port: 8100 }]
