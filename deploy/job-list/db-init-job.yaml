# Run once, before the first deploy of job-list: creates its own database and role inside the existing Postgres.
# Safe to run again after deleting the finished Job (`kubectl -n cvhelper delete job job-list-db-init`).
apiVersion: batch/v1
kind: Job
metadata:
  name: job-list-db-init
  namespace: cvhelper
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: job-list-db-init }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: job_search }
            - { name: PGDATABASE, value: postgres }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: cvhelper-secrets, key: POSTGRES_PASSWORD } }
            - name: JOB_LIST_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: job-list-secrets, key: DB_PASSWORD } }
          command:
            - sh
            - -c
            - |
              set -e
              psql -v ON_ERROR_STOP=1 -v pw="$JOB_LIST_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE job_list LOGIN PASSWORD %L', :'pw')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'job_list') \gexec
              SELECT format('ALTER ROLE job_list PASSWORD %L', :'pw') \gexec
              SELECT 'CREATE DATABASE job_list OWNER job_list'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'job_list') \gexec
              SQL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
