# job-list is set up by hand once: `kubectl apply -f db-init-job.yaml`, and the job-list-secrets Secret (see
# deploy/README.md, section "job-list"). After that deploy/deploy.sh updates it with every release, last, and only
# where job-list-secrets exists.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cvhelper
resources:
  - job-list.yaml
  - ingress.yaml
images:
  - name: job-list
    newName: ghcr.io/zhenyazhd/cvhelper-job-list
    newTag: latest
