# The Telegram bot runs outside the cluster and reaches job-list here; core-api uses the Service name instead.
# Only /mcp is routed: the bot's agent has no business with the REST API (which can delete profiles). Every call still
# needs a bearer token; the rate limit only slows guessing and abuse.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: job-list-rate-limit
spec:
  rateLimit:
    average: 20
    period: 1s
    burst: 40
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-list
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: cvhelper-job-list-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jobs.cvhelper.dev]
      secretName: jobs-cvhelper-dev-tls
  rules:
    - host: jobs.cvhelper.dev
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service: { name: job-list, port: { name: http } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-list-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cvhelper-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jobs.cvhelper.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: job-list, port: { name: http } }
