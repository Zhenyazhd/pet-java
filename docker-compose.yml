services:
  postgres:
    image: postgres:16-alpine
    container_name: job-search-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_search}
      POSTGRES_USER: ${POSTGRES_USER:-job_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_search}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_search} -d ${POSTGRES_DB:-job_search}"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: adobe/s3mock:4.1.1
    container_name: job-search-s3
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9090}:9090"
    environment:
      initialBuckets: ${S3_BUCKET:-job-search-cvs}
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3_data:/tmp/s3-mock

volumes:
  postgres_data:
  s3_data:
