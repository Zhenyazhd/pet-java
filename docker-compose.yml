services:
  postgres:
    image: postgres:16-alpine
    container_name: job-search-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_search}
      POSTGRES_USER: ${POSTGRES_USER:-job_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_search}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_search} -d ${POSTGRES_DB:-job_search}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pdf-worker:
    build: tools/pdf-worker
    image: job-search-pdf-worker
    container_name: job-search-pdf-worker
    restart: unless-stopped
    # Bound to localhost only: core-api runs on the host in local development. In production put the
    # worker on an `internal: true` network shared only with core-api, so it has no internet access.
    ports:
      - "127.0.0.1:${PDF_WORKER_PORT:-8090}:8090"
    environment:
      WORKER_TOKEN: ${PDF_WORKER_TOKEN:?set PDF_WORKER_TOKEN in .env}
    # The JVM is PID 1 and does not reap processes it did not start; an init does, so a killed compile leaves no zombies.
    init: true
    read_only: true
    tmpfs:
      # A compile writes its log and PDF here; a runaway one must hit a ceiling, not fill the host's memory.
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g

  ats-worker:
    build: tools/ats-worker
    image: job-search-ats-worker
    container_name: job-search-ats-worker
    restart: unless-stopped
    # Bound to localhost only: core-api runs on the host in local development. In production put the
    # worker on an `internal: true` network shared only with core-api. The vacancy match (POST /score) calls the
    # model provider, so it needs outbound access to it; the PDF check does not.
    ports:
      - "127.0.0.1:${ATS_WORKER_PORT:-8091}:8091"
    environment:
      WORKER_TOKEN: ${ATS_WORKER_TOKEN:?set ATS_WORKER_TOKEN in .env}
      # Optional: enables POST /score (LLM scoring). Same key as core-api; unset means that endpoint answers 503.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SCORE_MODEL: ${SCORE_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      SCORE_TIMEOUT_SECONDS: ${SCORE_TIMEOUT_SECONDS:-}
      SCORE_CONCURRENCY: ${SCORE_CONCURRENCY:-}
      # core-api runs two checks at once; with `cpus: 1` the default (the CPU count) would make the second one wait.
      WORKER_CONCURRENCY: ${ATS_WORKER_CONCURRENCY:-2}
    init: true
    # On stop the worker reports "draining" for 5 s, then waits up to 25 s for requests in flight (SHUTDOWN_GRACE_SECONDS).
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      # PDFBox spills decoded streams to temp files; this is the ceiling for a PDF that decodes to far more than a
      # resume should. It counts against mem_limit, which also holds the 512 MB heap (see the Dockerfile).
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g

  # --- Job matches (optional): `npm run infra:jobs` -------------------------------------------------------------
  # Not started by the default `docker compose up` / `npm run dev`; needs Apify + OpenRouter keys and costs money
  # per search. See "Job matches (optional)" in README.md.

  # One-shot and idempotent: creates the job_list role and database in the shared Postgres (or just re-syncs the
  # role's password). The Postgres volume's init scripts only run on an empty volume, so this does it explicitly.
  job-list-db:
    image: postgres:16-alpine
    profiles: ["jobs"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-job_search}
      PGPASSWORD: ${POSTGRES_PASSWORD:-job_search}
      PGDATABASE: ${POSTGRES_DB:-job_search}
      JOB_LIST_DB_PASSWORD: ${JOB_LIST_DB_PASSWORD:-}
      # Only checked here (job-list starts after this container succeeds). Compose cannot mark a variable of a
      # profile-only service as required without breaking `docker compose config` for the default profile.
      JOB_LIST_TOKEN: ${JOB_LIST_TOKEN:-}
      JOB_LIST_CLIENT_1_TOKEN: ${JOB_LIST_CLIENT_1_TOKEN:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      JOB_LIST_OPENROUTER_API_KEY: ${JOB_LIST_OPENROUTER_API_KEY:-}
    command:
      - sh
      - -c
      - |
        for v in JOB_LIST_DB_PASSWORD JOB_LIST_TOKEN JOB_LIST_CLIENT_1_TOKEN APIFY_TOKEN JOB_LIST_OPENROUTER_API_KEY; do
          [ -n "$$(printenv "$$v")" ] || { echo "job-list: set $$v in .env (see README: Job matches)" >&2; exit 1; }
        done
        psql -v ON_ERROR_STOP=1 -v pw="$$JOB_LIST_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE job_list LOGIN PASSWORD %L', :'pw') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'job_list') \gexec
        SELECT format('ALTER ROLE job_list PASSWORD %L', :'pw') \gexec
        SELECT 'CREATE DATABASE job_list OWNER job_list' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'job_list') \gexec
        SQL
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  job-list:
    build: tools/job-list
    image: job-search-job-list
    container_name: job-search-job-list
    profiles: ["jobs"]
    restart: unless-stopped
    depends_on:
      job-list-db:
        condition: service_completed_successfully
    # Localhost only: core-api runs on the host in local development and reaches it at JOB_LIST_BASE_URL.
    ports:
      - "127.0.0.1:${JOB_LIST_PORT:-8100}:8100"
    environment:
      JOB_LIST_DB_URL: jdbc:postgresql://postgres:5432/job_list
      JOB_LIST_DB_USER: job_list
      JOB_LIST_DB_PASSWORD: ${JOB_LIST_DB_PASSWORD:-}
      # core-api's bearer token (the same value core-api reads as JOB_LIST_TOKEN).
      JOB_LIST_CLIENT_0_TOKEN: ${JOB_LIST_TOKEN:-}
      # The second client (Telegram bot) is not wired yet, but the service refuses to start without a token for it.
      JOB_LIST_CLIENT_1_TOKEN: ${JOB_LIST_CLIENT_1_TOKEN:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      # A key of its own (with a credit limit), not core-api's OPENROUTER_API_KEY.
      OPENROUTER_API_KEY: ${JOB_LIST_OPENROUTER_API_KEY:-}
      JOB_LIST_LLM_MODEL: ${JOB_LIST_LLM_MODEL:-deepseek/deepseek-chat}
      APIFY_MONTHLY_BUDGET_USD: ${APIFY_MONTHLY_BUDGET_USD:-5}
      JOB_LIST_LLM_MONTHLY_BUDGET_USD: ${JOB_LIST_LLM_MONTHLY_BUDGET_USD:-2}
      JOB_LIST_MAX_RUNS_PER_OWNER_PER_DAY: ${JOB_LIST_MAX_RUNS_PER_OWNER_PER_DAY:-3}
      JOB_LIST_MAX_RANK_RUNS_PER_OWNER_PER_DAY: ${JOB_LIST_MAX_RANK_RUNS_PER_OWNER_PER_DAY:-20}
      JOB_LIST_MAX_RANK_RUNS_PER_CLIENT_PER_DAY: ${JOB_LIST_MAX_RANK_RUNS_PER_CLIENT_PER_DAY:-200}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g
    healthcheck:
      # The JRE image has neither curl nor wget; bash can speak HTTP/1.0 through /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8100 && printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  postgres_data:
