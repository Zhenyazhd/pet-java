services:
  postgres:
    image: postgres:16-alpine
    container_name: job-search-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_search}
      POSTGRES_USER: ${POSTGRES_USER:-job_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_search}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_search} -d ${POSTGRES_DB:-job_search}"]
      interval: 5s
      timeout: 5s
      retries: 5

  latex-worker:
    build: tools/latex-worker
    image: job-search-latex-worker
    container_name: job-search-latex-worker
    restart: unless-stopped
    # Bound to localhost only: core-api runs on the host in local development. In production put the
    # worker on an `internal: true` network shared only with core-api, so it has no internet access.
    ports:
      - "127.0.0.1:${LATEX_WORKER_PORT:-8090}:8090"
    environment:
      WORKER_TOKEN: ${LATEX_WORKER_TOKEN:?set LATEX_WORKER_TOKEN in .env}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g

volumes:
  postgres_data:
